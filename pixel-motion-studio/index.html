<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Lark · Pixel Motion Studio</title>
<style>:root {
  color-scheme: dark;
  --bg: #101416;
  --panel: #171d20;
  --line: #343e42;
  --ink: #f4efdf;
  --muted: #aebdbd;
  --accent: #ebad72;
  --mint: #9ae6cd;
  --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at 80% 0, #202b2c 0, transparent 44rem), var(--bg);
  color: var(--ink);
  font: 15px/1.4 system-ui, sans-serif;
}
main { max-width: 1152px; padding: 0 32px; margin: auto; }
.mast, .intro, footer { display: flex; align-items: center; justify-content: space-between; }
.mast { height: 67px; border-bottom: 1px solid var(--line); }
.wordmark { display: flex; align-items: center; gap: 11px; font-weight: 700; }
.mark { display: grid; place-items: center; background: #223b35; color: var(--mint); width: 30px; height: 30px; border: 1px solid #4f7167; border-radius: 7px; }
.edition, .eyebrow, .spec, .pane-meta, .timeline, footer { font: 11px/1.45 var(--mono); color: var(--muted); letter-spacing: .08em; }
.edition b { color: var(--accent); margin-left: 6px; }
.intro { padding: 23px 0 24px; align-items: end; }
.eyebrow { color: var(--mint); display: flex; align-items: center; gap: 7px; }
.eyebrow span { width: 7px; height: 7px; background: var(--mint); }
h1 { margin: 1px 0 0; font: 500 clamp(52px, 8vw, 76px)/.98 Georgia, serif; letter-spacing: -.07em; }
h1 span { color: var(--accent); }
.intro p { color: var(--muted); margin: 5px 0 0; }
.spec { display: flex; gap: 8px; flex-wrap: wrap; justify-content: end; }
.spec span { border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; white-space: nowrap; }
.studio { background: var(--panel); border: 1px solid var(--line); border-radius: 13px; overflow: hidden; box-shadow: 0 20px 50px #0004; }
.toolbar, .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 10px 15px; gap: 10px 16px; }
.actions, .transport, .settings { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
button, select {
  min-height: 36px;
  padding: 5px 11px;
  color: var(--ink);
  font: inherit;
  font-size: 13px;
  background: #222a2d;
  border: 1px solid var(--line);
  border-radius: 6px;
  cursor: pointer;
}
button:hover, select:hover { border-color: #768985; background: #2a3739; }
.actions button { background: transparent; border-color: transparent; font-weight: 650; }
.actions button:hover { background: #263232; }
.actions button[aria-pressed="true"] { color: var(--mint); background: #203631; border-color: #496f63; }
.actions span { color: var(--muted); font: 10px var(--mono); margin-right: 4px; }
.toggle, .settings label { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 13px; }
.toggle { padding: 5px 4px; cursor: pointer; }
input { accent-color: var(--mint); }
input[type="checkbox"] { width: 16px; height: 16px; margin: 0; }
:focus-visible { outline: 2px solid #ffd196; outline-offset: 3px; }
.panes { display: grid; grid-template-columns: minmax(0, 1fr); padding: 0 15px; gap: 10px; }
.panes.comparing { grid-template-columns: repeat(2, minmax(0, 1fr)); }
figure { margin: 0; min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; }
figcaption { display: flex; gap: 8px; align-items: center; padding: 4px 11px; min-height: 42px; background: #1e2628; font-size: 13px; }
figcaption select { min-height: 29px; padding: 3px 6px; }
.indicator { width: 7px; height: 7px; background: var(--mint); border-radius: 50%; }
.indicator.secondary { background: var(--accent); }
.pane-meta { margin-left: auto; text-align: right; }
.stage {
  height: 264px;
  display: grid;
  align-items: center;
  justify-items: safe center;
  overflow: auto;
  background-color: #10191a;
  background-image: radial-gradient(circle at center, #243a38, transparent 69%),
    radial-gradient(#7ba29838 1px, transparent 1px);
  background-size: auto, 16px 16px;
  background-position: center;
}
.stage:focus-visible { outline-offset: -3px; }
.stage:has(canvas[width="384"]) { height: 396px; }
.stage[data-bg="light"] { background: #e5dcca; }
.stage[data-bg="checker"] { background: repeating-conic-gradient(#738180 0 25%, #a2adab 0 50%) 0 0 / 24px 24px; }
canvas { display: block; image-rendering: pixelated; }
.timeline { padding: 12px 17px 11px; }
.timeline-head, .timeline-foot { display: flex; justify-content: space-between; }
.timeline-head { color: var(--ink); }
input[type="range"] { display: block; width: 100%; margin: 7px 0 5px; height: 20px; cursor: pointer; }
.controls { border-top: 1px solid var(--line); }
#play { background: var(--accent); color: #251910; border-color: var(--accent); font-weight: 750; min-width: 71px; }
#play:hover { background: #ffca95; }
.settings { gap: 9px; }
footer { padding: 15px 1px 24px; gap: 12px; flex-wrap: wrap; }
kbd { font: inherit; color: var(--ink); border: 1px solid var(--line); border-radius: 3px; padding: 1px 4px; }
#error { padding: 0 16px; color: #ffb79f; }
@media (max-width: 690px) {
  main { padding: 0 13px; }
  .panes.comparing { grid-template-columns: minmax(0, 1fr); }
  .panes.comparing .stage:not(:has(canvas[width="384"])) { height: 205px; }
  .toolbar, .controls { padding: 9px; gap: 6px; }
  .panes { padding: 0 9px; }
  .actions { gap: 1px; }
  .actions button { padding: 4px 7px; }
  .actions span { display: none; }
  .spec { gap: 4px; }
  .spec span { padding: 4px; }
  .stage { height: 231px; }
}

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
#sync-note { color: var(--mint); }
.hold-label { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header class="mast">
    <div class="wordmark"><span class="mark" aria-hidden="true">✦</span> Pixel Motion Studio</div>
    <span class="edition">SPRITE STUDY <b>001</b></span>
  </header>
  <section class="intro" aria-labelledby="title">
    <div>
      <div class="eyebrow"><span></span> CHARACTER / 01</div>
      <h1 id="title">Lark<span>.</span></h1>
      <p>Waypost courier</p>
    </div>
    <div class="spec"><span>96 × 96 PX</span><span>80 MS / TICK</span></div>
  </section>

  <section class="studio" aria-label="Animation viewer">
    <div class="toolbar">
      <div class="actions" role="group" aria-label="Action">
        <button data-action="idle" aria-pressed="true"><span>01</span> Idle</button>
        <button data-action="run" aria-pressed="false"><span>02</span> Run</button>
        <button data-action="jump" aria-pressed="false"><span>03</span> Jump</button>
        <button data-action="attack" aria-pressed="false"><span>04</span> Attack</button>
      </div>
      <label class="toggle"><input type="checkbox" id="compare" aria-describedby="sync-help"> Compare</label>
    </div>
    <span id="sync-help" class="sr-only">Both actions use the same clock. The shorter action holds its final pose.</span>
    <div id="panes" class="panes">
      <figure>
        <figcaption><span class="indicator"></span><b id="primary-name">Idle</b><span class="pane-meta" id="primary-meta"></span></figcaption>
        <div class="stage" data-bg="dark" tabindex="0" role="region" aria-label="Primary animation canvas">
          <canvas id="primary" width="96" height="96" role="img" aria-label="Lark, Idle"></canvas>
        </div>
      </figure>
      <figure id="secondary-pane" hidden>
        <figcaption><span class="indicator secondary"></span>
          <select id="secondary-action" aria-label="Comparison action">
            <option value="idle">Idle</option><option value="run" selected>Run</option>
            <option value="jump">Jump</option><option value="attack">Attack</option>
          </select>
          <span class="pane-meta" id="secondary-meta"></span>
        </figcaption>
        <div class="stage" data-bg="dark" tabindex="0" role="region" aria-label="Comparison animation canvas">
          <canvas id="secondary" width="96" height="96" role="img" aria-label="Lark, Run"></canvas>
        </div>
      </figure>
    </div>

    <div class="timeline">
      <div class="timeline-head">
        <label for="seek">TIMELINE <span id="sync-note" hidden>· SHARED CLOCK</span></label>
        <output id="clock" for="seek" aria-live="off">0.00 s</output>
      </div>
      <input type="range" id="seek" min="0" max="1" step="1" value="0" aria-label="Timeline position">
      <div class="timeline-foot"><span id="frame">FRAME 01 / 06</span><span id="length"></span></div>
    </div>

    <div class="controls">
      <div class="transport" role="group" aria-label="Playback">
        <button id="prev" aria-label="Previous frame" title="Previous frame (Left arrow)"><span aria-hidden="true">|◀</span></button>
        <button id="play" aria-label="Pause" title="Play or pause (Space)">Pause</button>
        <button id="next" aria-label="Next frame" title="Next frame (Right arrow)"><span aria-hidden="true">▶|</span></button>
        <label class="toggle"><input type="checkbox" id="loop" checked> Loop</label>
      </div>
      <div class="settings">
        <label>Speed <select id="speed">
          <option value=".25">0.25×</option><option value=".5">0.5×</option>
          <option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option>
        </select></label>
        <label>Zoom <select id="zoom">
          <option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option>
        </select></label>
        <label>Backdrop <select id="background">
          <option value="dark">Dark</option><option value="light">Light</option><option value="checker">Checker</option>
        </select></label>
        <label class="toggle"><input type="checkbox" id="guide"> Ground</label>
      </div>
    </div>
    <p id="error" role="alert" hidden>The sprite assets could not be loaded.</p>
  </section>
  <footer><span>LARK / WAYPOST COURIER</span><span><kbd>Space</kbd> Play / pause <kbd>←</kbd> <kbd>→</kbd> Step</span></footer>
</main>

<script>"use strict";

const { manifest, sheets } = JSON.parse(document.querySelector("#project-data").textContent);
const byId = id => document.getElementById(id);
const actions = [...document.querySelectorAll("[data-action]")];
const seek = byId("seek");
const play = byId("play");
const loop = byId("loop");
const speed = byId("speed");
const zoom = byId("zoom");
const compare = byId("compare");
const comparison = byId("secondary-action");
const guide = byId("guide");
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
const panes = [
  { canvas: byId("primary"), meta: byId("primary-meta") },
  { canvas: byId("secondary"), meta: byId("secondary-meta") },
];
const images = {};
const { width, height, anchor } = manifest.canvas;

for (const clip of Object.values(manifest.clips)) {
  clip.starts = [];
  clip.duration = 0;
  for (const frame of clip.frames) {
    clip.starts.push(clip.duration);
    clip.duration += frame.hold * manifest.tickMs;
  }
}

let active = "idle";
let time = 0;
let playing = !reducedMotion.matches;
let ready = false;
let request = null;
let lastTimestamp = null;
const first = () => manifest.clips[active];
const second = () => manifest.clips[comparison.value];
const duration = () => compare.checked ? Math.max(first().duration, second().duration) : first().duration;
const seconds = ms => (ms / 1000).toFixed(2) + " s";

function frameAt(clip, ms) {
  const next = clip.starts.findIndex(start => start > ms);
  return next < 0 ? clip.frames.length - 1 : next - 1;
}

function draw(pane, clip, index) {
  const holding = compare.checked && time >= clip.duration && clip.duration < duration();
  const { meta } = pane;
  const label = String(index + 1).padStart(2, "0") + " / " + clip.frames.length;
  if (meta.textContent !== (holding ? label + " · Hold" : label)) {
    meta.textContent = label;
    if (holding) {
      const status = document.createElement("span");
      status.className = "hold-label";
      status.textContent = " · Hold";
      meta.append(status);
    }
  }
  const scale = Number(zoom.value);
  const { canvas } = pane;
  const backdrop = byId("background").value;
  canvas.parentElement.dataset.bg = backdrop;
  const key = [clip.sheet, index, scale, guide.checked, backdrop].join("/");
  if (key === pane.lastDraw) return;
  pane.lastDraw = key;

  if (canvas.width !== width * scale) {
    canvas.width = width * scale;
    canvas.height = height * scale;
    // Keep the origin centered when a narrow stage must scroll at 4×.
    canvas.parentElement.scrollLeft = (canvas.width - canvas.parentElement.clientWidth) / 2;
  }

  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (guide.checked) {
    ctx.strokeStyle = backdrop === "dark" ? "#89b8ab" : "#334f4b";
    ctx.setLineDash([3 * scale, 3 * scale]);
    ctx.beginPath();
    ctx.moveTo(7 * scale, anchor.y * scale + .5);
    ctx.lineTo((width - 7) * scale, anchor.y * scale + .5);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = ctx.strokeStyle;
    ctx.fillRect(anchor.x * scale, (anchor.y + 1) * scale, scale, 3 * scale);
  }
  const [x, y, w, h] = clip.frames[index].rect;
  ctx.drawImage(images[clip.sheet], x, y, w, h, 0, 0, canvas.width, canvas.height);
  canvas.setAttribute("aria-label", "Lark, " + clip.label);
}

function render() {
  if (!ready) return;
  const current = frameAt(first(), time);
  draw(panes[0], first(), current);
  if (compare.checked) draw(panes[1], second(), frameAt(second(), time));
  seek.max = duration();
  seek.value = Math.floor(time);
  seek.setAttribute("aria-valuetext", seconds(time) + ", frame " + (current + 1));
  byId("clock").textContent = seconds(time);
  byId("length").textContent = seconds(duration()) + " TOTAL";
  byId("frame").textContent = "FRAME " + String(current + 1).padStart(2, "0") + " / " + String(first().frames.length).padStart(2, "0");
  byId("primary-name").textContent = first().label;
  play.textContent = playing ? "Pause" : "Play";
  play.setAttribute("aria-label", play.textContent);
}

function tick(timestamp) {
  request = null;
  if (lastTimestamp !== null) time += (timestamp - lastTimestamp) * Number(speed.value);
  lastTimestamp = timestamp;
  const end = duration();
  if (time >= end) {
    if (loop.checked) {
      time %= end;
    } else {
      time = end;
      setPlaying(false);
    }
  }
  render();
  schedule();
}

function schedule() {
  if (ready && playing && request === null && !document.hidden) request = requestAnimationFrame(tick);
}

function setPlaying(value) {
  if (value && time >= duration()) time = 0;
  playing = value;
  lastTimestamp = null;
  if (!value && request !== null) {
    cancelAnimationFrame(request);
    request = null;
  }
  render();
  schedule();
}

function step(direction) {
  // In comparison, advance through the union of both clips' pose changes.
  const starts = compare.checked
    ? [...new Set([...first().starts, ...second().starts])].sort((a, b) => a - b)
    : first().starts;
  const index = starts.findLastIndex(start => start <= time);
  const target = index + direction;
  const bounded = loop.checked
    ? (target + starts.length) % starts.length
    : Math.max(0, Math.min(starts.length - 1, target));
  time = starts[bounded];
  setPlaying(false);
}

for (const button of actions) {
  button.addEventListener("click", () => {
    active = button.dataset.action;
    for (const option of actions) option.setAttribute("aria-pressed", option === button);
    if (!compare.checked) loop.checked = first().loop;
    time = 0;
    lastTimestamp = null;
    render();
  });
}

play.addEventListener("click", () => setPlaying(!playing));
byId("prev").addEventListener("click", () => step(-1));
byId("next").addEventListener("click", () => step(1));
seek.addEventListener("input", () => {
  time = Number(seek.value);
  setPlaying(false);
});

compare.addEventListener("change", () => {
  byId("secondary-pane").hidden = !compare.checked;
  byId("sync-note").hidden = !compare.checked;
  byId("panes").classList.toggle("comparing", compare.checked);
  if (!compare.checked) loop.checked = first().loop;
  time = Math.min(time, duration());
  // The secondary canvas may have been laid out at a different width.
  panes[1].lastDraw = null;
  render();
});
comparison.addEventListener("change", () => {
  time = Math.min(time, duration());
  render();
});
for (const control of [zoom, byId("background"), guide]) control.addEventListener("change", render);
speed.addEventListener("change", () => { lastTimestamp = null; });
document.addEventListener("visibilitychange", () => {
  lastTimestamp = null;
  if (document.hidden && request !== null) {
    cancelAnimationFrame(request);
    request = null;
  }
  schedule();
});
reducedMotion.addEventListener("change", event => {
  if (event.matches) setPlaying(false);
});
document.addEventListener("keydown", event => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest("select, textarea, input:not([type=range]):not([type=checkbox]), [contenteditable]")) return;
  if (event.code === "Space") {
    if (event.target.closest("input, button")) return;
    event.preventDefault();
    if (!event.repeat) setPlaying(!playing);
  } else if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
    const stage = event.target.closest(".stage");
    if (stage && stage.scrollWidth > stage.clientWidth) return;
    event.preventDefault();
    step(event.key === "ArrowLeft" ? -1 : 1);
  }
});

Promise.all(Object.entries(sheets).map(async ([path, data]) => {
  const image = new Image();
  image.src = data;
  await image.decode();
  images[path] = image;
})).then(() => {
  ready = true;
  render();
  schedule();
}).catch(error => {
  console.error(error);
  byId("error").hidden = false;
});
</script>
